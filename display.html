<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Work Quiz – Big screen</title>
<link rel="stylesheet" href="style.css?v=2.2">
</head>
<body class="display">
<canvas id="d-snow" class="fx-layer" aria-hidden="true"></canvas>
<div class="lights" id="d-lights" aria-hidden="true"></div>
<div class="stage">
  <div class="topbar">
    <span id="d-top-left">Work Quiz</span>
    <span id="d-top-right"></span>
  </div>
  <div class="main" id="d-main">
    <p class="muted">Connecting…</p>
  </div>
</div>
<canvas id="d-confetti" class="fx-layer fx-top" aria-hidden="true"></canvas>
<button class="btn" id="d-full" style="position:fixed; right:16px; bottom:16px; opacity:.7">Full screen</button>

<script src="firebase-config.js?v=2.2"></script>
<script src="quiz-lib.js?v=2.2"></script>
<script src="common.js?v=2.2"></script>
<script src="pin.js?v=2.2"></script>
<script src="rounds.js?v=2.2"></script>
<script src="display.js?v=2.2"></script>
</body>
</html>
