<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3366"/>
      <stop offset="1" stop-color="#4a6fa8"/>
    </linearGradient>
    <radialGradient id="snowball" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".75" stop-color="#eef3fa"/>
      <stop offset="1" stop-color="#c9d6e8"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#night)"/>
  <!-- stars and falling snow -->
