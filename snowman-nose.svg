    <circle cx="560" cy="190" r="2.5"/><circle cx="120" cy="330" r="3"/><circle cx="700" cy="420" r="3.5"/><circle cx="60" cy="520" r="3"/>
    <circle cx="300" cy="60" r="2.5"/><circle cx="470" cy="40" r="3"/><circle cx="760" cy="600" r="2.5"/><circle cx="40" cy="700" r="3"/>
  </g>
